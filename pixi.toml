[workspace]
name = "mumag2022"
version = "0.1.0"
description = "Development environment for MuMag2022 Python"
authors = ["Michael P. Adams"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.26"
scipy = ">=1.11"
matplotlib = ">=3.8"
pytest = ">=8"
pip = ">=24"

[pypi-dependencies]
mumag2022 = { path = ".", editable = true }
shiny = ">=1.8,<2"
shinylive = "==0.8.12"

[tasks]
test = "pytest"
web = "shiny run --host 127.0.0.1 --port 8000 src/app.py"
export-site = "shinylive export src site"
example = "python examples/synthetic_fit.py"
