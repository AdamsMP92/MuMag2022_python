name: Test MuMag2022 Python

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test,web]"
      - name: Run tests
        run: python -m pytest
      - name: Import web application
        run: python -c 'import sys; sys.path.insert(0, "src"); import app; assert app.app is not None'

