[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mumag2022"
version = "0.1.0"
description = "Stable Python analysis of field-dependent unpolarized magnetic SANS data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Michael P. Adams" }]
keywords = ["SANS", "magnetic scattering", "micromagnetics", "exchange stiffness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://adamsmp92.github.io/MuMag2022_python/"
Repository = "https://github.com/AdamsMP92/MuMag2022_python"
Issues = "https://github.com/AdamsMP92/MuMag2022_python/issues"
Changelog = "https://github.com/AdamsMP92/MuMag2022_python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]
web = ["shiny>=1.8,<2", "shinylive==0.8.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/mumag2022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
